          Conducted research on EU trade policy, global governance institutions, and
          corporate accountability mechanisms. Member of research team for H2020 Project
          GLOBE (2019-2022), with a leading role for Work Packages on Trade and
          Sustainable Development and on Innovative Governance Models. Responsible for
          communication, dissemination, and exploitation strategy for EU H2020 Project
          RECONNECT (2018-2022), which received special recognition by the European
          Commission. Junior member of coordination team.

    Projects:
      - name: "MEDIATE — Moderating due diligence through intermediary engagement (FWO SBO Project)"
        summary: >
          Co-first author of successful research proposal for Strategic Basic Research
          funding from Research Foundation Flanders (FWO). Lead researcher examining the
          role of intermediaries (government agencies, consulting firms, voluntary
          sustainability standards, trade unions, and others) in implementing mandatory
          due diligence legislation. Member of project coordination team managing
          multi-partner research consortium and multi-stakeholder advisory council.
        start_date: 2024-01-01
        end_date: 2028-01-01
      - name: "TANDEM — Transatlantic Network for Dialogue, Education and Multidisciplinary Research (Jean Monnet Network)"
        summary: >
          Member of project management team; network contributor examining EU-US
          engagement on trade and sustainability governance.
        start_date: 2026-01-01
        end_date: 2029-01-01
      - name: "EU-RENEW — EU Research and Education Network on Europe in the World (Jean Monnet Policy Debate Network)"
        summary: >
          Co-Manager of network involving 15+ institutions across Europe. Coordinated
          network research outputs and multi-stakeholder dialogues. Co-edited open-access
          textbook Europe in the World and co-developed a Massive Open Online Course on
          EU External Affairs. Managed network communications and stakeholder engagement.
        start_date: 2023-01-01
        end_date: 2026-01-01
      - name: "EU-VALUES — EU Research and Education Network on Foreign Policy Issues: Values and Democracy (Jean Monnet Network)"
        summary: "Network contributor; member of coordination team."
        start_date: 2024-01-01
        end_date: 2027-01-01
      - name: "GLOBE — The European Union and the Future of the Global Governance: Future Trends and Scenarios (EU H2020 Project)"
        summary: >
          Lead researcher for work packages on Trade and Sustainable Development and on
          Innovative Governance Models. Lead coordinator for the Dissemination work
          package. Conducted comparative institutional analysis across multiple global
          governance regimes and contributed to the final report projecting future
          scenarios for international organizations.
        start_date: 2019-01-01
        end_date: 2022-01-01

