    Research Funding and Projects:
      - title: "FWO SBO Project: 'Moderating due diligence through intermediary engagement' (MEDIATE)"
        authors: ["Research Foundation Flanders (FWO)"]
        releaseDate: "2024-2028"
        summary: >
          Co-first author of successful research proposal for Strategic Basic Research
          funding. Lead researcher examining the role of intermediaries (government
          agencies, consulting firms, voluntary sustainability standards, trade unions,
          and others) in implementing mandatory due diligence legislation. Member of
          project coordination team managing multi-partner research consortium and
          multi-stakeholder advisory council.
